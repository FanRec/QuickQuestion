[package]
name = "quickquestion"
version = "0.1.0"
description = "QuickQuestion - desktop floating AI Q&A"
authors = ["KongJi"]
edition = "2021"

[lib]
name = "quickquestion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
